/* ============================================================
   Video info bar
   ============================================================ */
.video-info-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  padding: .65rem .9rem;
  margin: .25rem .5rem .75rem;
  border-radius: 12px;
  background: rgba(var(--textPrimary, 240 240 245) / .05);
  border: 1px solid rgba(var(--textPrimary, 240 240 245) / .08);
  animation: fadeInUp .3s ease both;
}

.video-info-text {
  display: flex;
  flex-direction: column;
  gap: .1rem;
  min-width: 0;
  flex: 1 1 auto;
}
.video-info-label {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: .5;
}
.video-info-title {
  font-size: .85rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: rgb(var(--textPrimary, 240 240 245));
}
.video-info-channel {
  font-size: .75rem;
  opacity: .65;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.video-info-actions {
  display: flex;
  gap: .4rem;
  flex: 0 0 auto;
}
.video-info-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .35rem .7rem;
  font-size: .75rem;
  font-weight: 600;
  border-radius: 999px;
  background: rgba(var(--textPrimary) / .07);
  border: 1px solid rgba(var(--textPrimary) / .12);
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background .15s, transform .12s;
  font-family: inherit;
}
.video-info-btn:hover {
  background: rgba(var(--textPrimary) / .14);
  transform: translateY(-1px);
}

/* Album art hover affordance while NOT in video mode */
.album-art-wrapper:not(.video-mode) { cursor: pointer; }
@media (hover: hover) {
  .album-art-wrapper:not(.video-mode):hover::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.22) 100%);
    pointer-events: none;
    border-radius: inherit;
  }
}

/* Long-press hint on touch devices */
@media (hover: none) and (pointer: coarse) {
  .album-art-wrapper:not(.video-mode)::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
    background: radial-gradient(circle at center, rgba(0,0,0,.4), transparent 65%);
  }
  .album-art-wrapper:active::before { opacity: 1; }
}

  <script>
    (function initTheme() {
      var DARK_THEMES  = ['dark', 'midnight', 'graphite', 'forest'];
      var LIGHT_THEMES = ['ivory', 'slate', 'linen', 'mint', 'chalk', 'aurora'];
      var ALL_THEMES   = DARK_THEMES.concat(LIGHT_THEMES);

      var THEME_COLORS = {
        dark:     '#353b45',
        midnight: '#29303c',
        graphite: '#3a3a3d',
        forest:   '#313e37',
        ivory:    '#e8e0d4',
        slate:    '#dae4f0',
        linen:    '#ecdece',
        mint:     '#d8eae4',
        chalk:    '#eeecea',
        aurora:   '#eae2f6'
      };

      var savedTheme = localStorage.getItem('theme') || 'light';
      if (ALL_THEMES.indexOf(savedTheme) === -1) {
        savedTheme = 'ivory';
      }

      document.documentElement.setAttribute('data-theme', savedTheme);

      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', THEME_COLORS[savedTheme] || THEME_COLORS.ivory);
      }

      var isDark = DARK_THEMES.indexOf(savedTheme) !== -1;
      document.querySelectorAll('.themeToggle').forEach(function (btn) {
        btn.classList.toggle('dark', isDark);
      });
    })();
  </script>

    /* ─────────────────────────────────────────────────────────────────────
       4. BASE ELEMENTS
       ───────────────────────────────────────────────────────────────────── */
    body {
      min-height: 100vh;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      font-family: var(--font-body);
      font-size: var(--fs-400);
      font-weight: var(--fw-normal);
      line-height: var(--lh-body);
      color: rgba(var(--textPrimary));

      background-color: rgba(var(--bgBody) / 0.835) !important;
      background-image:
        linear-gradient(rgba(var(--textOthers) / 0.06) 1px, transparent 0),
        linear-gradient(90deg, rgba(var(--textOthers) / 0.06) 1px, transparent 0);
      background-size: 40px 40px;

      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
    }

    ul,
    ol {
      list-style: none;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      font-weight: var(--fw-semibold);
      line-height: var(--lh-heading);

      max-width: 70ch;
      line-height: var(--lh-body);
      text-wrap: pretty;
    }

    code,

      font-family: var(--font-mono);
      font-size: .9rem;
    }

    /* ─────────────────────────────────────────────────────────────────────
       5. UTILITIES & LAYOUT
       ───────────────────────────────────────────────────────────────────── */

        </div>
      </div>

      <div class="divider"></div>

      <div id="search-results-container" class="results hidden"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       MAIN CONTENT MOUNT
       ═══════════════════════════════════════════════════════════════════════ -->
  <main id="main-content" class="wrapper"></main>

  <!-- ═══════════════════════════════════════════════════════════════════════
       PLAYER LAYERS
       ═══════════════════════════════════════════════════════════════════════ -->
  <div id="player-bar-container"></div>

  <div data-overlay="drawer" id="player-drawer-overlay"></div>
  <div id="full-player-drawer"></div>
  <div id="visualizer-canvas"></div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       OVERLAY LAYERS
       ═══════════════════════════════════════════════════════════════════════ -->
  <div data-overlay="modal" id="modal-overlay"></div>
  <div class="modal" id="modal"></div>
  <div data-overlay="toast" id="toast"></div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       GLOBAL AUDIO ELEMENT
       ═══════════════════════════════════════════════════════════════════════ -->
  <audio id="global-audio" preload="none" crossorigin="anonymous"></audio>

  <!-- ═══════════════════════════════════════════════════════════════════════
       PWA BOOTSTRAP
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="./pwa.js"></script>

  <!-- ───────────────────────────────────────────────────────────────────────
       Service-worker registration, update banner & lifecycle plumbing
       ─────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      /* ─── Configuration ─────────────────────────────────────────────── */
      const CONFIG = {
        swUrl: './serviceWorker.js',                      // Path to the service worker file
        swScope: '/',                         // Scope — must be at or below the SW file's location
        updateCheckIntervalMs: 10 * 60 * 1000, // Check for updates every 10 minutes
        updateBannerAutoShow: true,           // Auto-show the update banner when an update is found
        debug: (function () {
          // Enable debug via query param: ?sw-debug=1
          try {
            return new URLSearchParams(window.location.search).get('sw-debug') === '1';
          } catch (_) {
            return false;
          }
        })()
      };

      /* ─── State ─────────────────────────────────────────────────────── */
      const STATE = {
        supported: false,
        registration: null,
        installingWorker: null,
        waitingWorker: null,
        activeWorker: null,
        updateBanner: null,
        updateBannerVisible: false,
        updateCheckTimer: null,
        isOnline: typeof navigator !== 'undefined' ? navigator.onLine : true,
        deferredPrompt: null // shared reference for the install banner
      };

      /* ─── Logger ────────────────────────────────────────────────────── */
      const log   = CONFIG.debug ? (...args) => console.log('[SW·Reg]', ...args) : () => {};
      const warn  = (...args) => console.warn('[SW·Reg]', ...args);
      const error = (...args) => console.error('[SW·Reg]', ...args);

      log('Initialized with config:', CONFIG);

      /* ─── Feature Detection ─────────────────────────────────────────── */
      function detectSupport() {
        const hasSW      = 'serviceWorker' in navigator;
        const hasFetch   = 'fetch' in window;
        const hasPromise = typeof Promise !== 'undefined';
        const isSecure =
          window.location.protocol === 'https:' ||
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname.startsWith('192.168.') ||
          window.location.hostname.startsWith('10.') ||
          window.location.hostname.includes('.local');

        STATE.supported = hasSW && hasFetch && hasPromise && isSecure;

        if (!STATE.supported) {
          const reasons = [];
          if (!hasSW)      reasons.push('Service Worker API missing');
          if (!hasFetch)   reasons.push('Fetch API missing');
          if (!hasPromise) reasons.push('Promise support missing');
          if (!isSecure)   reasons.push('Non-secure context (requires HTTPS or localhost)');
          warn('Service Worker not supported:', reasons.join('; '));
        } else {
          log('Service Worker is supported');
        }

        return STATE.supported;
      }

      /* ─── Create Update Banner DOM ──────────────────────────────────── */
      function createUpdateBanner() {
        if (STATE.updateBanner) return STATE.updateBanner;

        const banner = document.createElement('div');
        banner.className = 'updateBanner';
        banner.setAttribute('data-overlay', 'update');
        banner.setAttribute('role', 'alert');
        banner.setAttribute('aria-live', 'polite');
        banner.innerHTML = `
          <div class="content">
            <p class="title">Update Available</p>
            <p class="desc">A new version is ready. Tap to refresh.</p>
          </div>
          <div class="refresh">
            <svg viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
          </div>
          <button class="close" aria-label="Dismiss update" title="Dismiss">&times;</button>
        `;

        // Click on banner body → trigger update
        banner.addEventListener('click', function (e) {
          // Don't trigger if the close button was clicked
          if (e.target.closest('.close')) return;
          triggerUpdate();
        });

        // Close button
        const closeBtn = banner.querySelector('.close');
        closeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          dismissUpdateBanner();
        });

        document.body.appendChild(banner);
        STATE.updateBanner = banner;
        log('Update banner DOM created');
        return banner;
      }

      /* ─── Show Update Banner ────────────────────────────────────────── */
      function showUpdateBanner() {
        if (STATE.updateBannerVisible) return;

        const banner = createUpdateBanner();
        banner.classList.remove('dismissing');
        void banner.offsetWidth; // force reflow to restart the animation
        banner.classList.add('visible');

        STATE.updateBannerVisible = true;
        log('Update banner shown');
      }

      /* ─── Dismiss Update Banner ─────────────────────────────────────── */
      function dismissUpdateBanner() {
        if (!STATE.updateBannerVisible || !STATE.updateBanner) return;

        const banner = STATE.updateBanner;
        banner.classList.add('dismissing');
        banner.classList.remove('visible');
        STATE.updateBannerVisible = false;

        banner.addEventListener(
          'animationend',
          function handler() {
            banner.classList.remove('dismissing');
            banner.removeEventListener('animationend', handler);
            log('Update banner dismissed');
          },
          { once: true }
        );
      }

      /* ─── Trigger Update (Skip Waiting + Reload) ────────────────────── */
      function triggerUpdate() {
        const waiting = STATE.waitingWorker;
        if (!waiting) {
          warn('No waiting worker to activate');
          return;
        }

        log('Triggering skipWaiting on waiting worker');
        waiting.postMessage({ type: 'SKIP_WAITING' });

        // Listen for controller change, then reload
        const controllerChangeHandler = function () {
          log('Controller changed — reloading page');
          navigator.serviceWorker.removeEventListener('controllerchange', controllerChangeHandler);
          window.location.reload();
        };

        navigator.serviceWorker.addEventListener('controllerchange', controllerChangeHandler);

        // Fallback: if controllerchange doesn't fire within 3s, reload anyway
        setTimeout(function () {
          if (
            navigator.serviceWorker.controller === STATE.waitingWorker ||
            STATE.waitingWorker?.state === 'activated'
          ) {
            log('Fallback reload after skipWaiting');
            navigator.serviceWorker.removeEventListener('controllerchange', controllerChangeHandler);
            window.location.reload();
          }
        }, 3000);
      }

      /* ─── Handle New Worker (Installing → Waiting) ──────────────────── */
      function handleNewWorker(worker) {
        log('New worker detected, state:', worker.state);

        STATE.installingWorker = worker;

        worker.addEventListener('statechange', function () {
          log('Worker state changed to:', worker.state);

          if (worker.state === 'installed') {
            // The new worker is installed but waiting
            STATE.waitingWorker = worker;
            STATE.installingWorker = null;

            if (CONFIG.updateBannerAutoShow) {
              showUpdateBanner();
            }

            log(
              'New worker is waiting. Update banner ' +
              (CONFIG.updateBannerAutoShow ? 'shown.' : 'suppressed.')
            );
          }

          if (worker.state === 'activated') {
            STATE.activeWorker = worker;
            STATE.waitingWorker = null;
            dismissUpdateBanner();
            log('New worker activated');
          }

          if (worker.state === 'redundant') {
            STATE.installingWorker = null;
            STATE.waitingWorker = null;
            warn('Worker became redundant');
          }
        });
      }

      /* ─── Register Service Worker ───────────────────────────────────── */
      async function registerSW() {
        if (!STATE.supported) return null;

        try {
          log('Registering service worker:', CONFIG.swUrl, 'scope:', CONFIG.swScope);

          const registration = await navigator.serviceWorker.register(CONFIG.swUrl, {
            scope: CONFIG.swScope,
            // 'updateViaCache: none' ensures the browser always fetches the latest
            // SW script (respecting HTTP cache headers)
            updateViaCache: 'none'
          });

          STATE.registration = registration;
          log('Registration successful. Scope:', registration.scope);

          /* ── Check existing state ─────────────────────────────────── */
          if (registration.installing) {
            log('Worker already installing');
            handleNewWorker(registration.installing);
          } else if (registration.waiting) {
            log('Worker already waiting (from previous visit)');
            STATE.waitingWorker = registration.waiting;
            handleNewWorker(registration.waiting);

            // Show banner immediately since there's a pending update
            if (CONFIG.updateBannerAutoShow) {
              showUpdateBanner();
            }
          } else if (registration.active) {
            STATE.activeWorker = registration.active;
            log('Active worker found. State:', registration.active.state);
          }

          /* ── Listen for updates ───────────────────────────────────── */
          registration.addEventListener('updatefound', function () {
            const newWorker = registration.installing;
            if (!newWorker) return;
            log('Update found — new worker installing');
            handleNewWorker(newWorker);
          });

          /* ── Periodic update checks ───────────────────────────────── */
          if (CONFIG.updateCheckIntervalMs > 0) {
            STATE.updateCheckTimer = setInterval(function () {
              log('Periodic update check triggered');
              if (STATE.registration) {
                STATE.registration.update().catch(function (err) {
                  warn('Periodic update check failed:', err.message);
                });
              }
            }, CONFIG.updateCheckIntervalMs);

            log(
              'Periodic update checks enabled every',
              CONFIG.updateCheckIntervalMs / 1000,
              'seconds'
            );
          }

          /* ── Controller reference ─────────────────────────────────── */
          if (navigator.serviceWorker.controller) {
            STATE.activeWorker = navigator.serviceWorker.controller;
            log('Page is controlled by SW. Script URL:', navigator.serviceWorker.controller.scriptURL);
          }

          return registration;

        } catch (err) {
          error('Service worker registration failed:', err.message);
          STATE.registration = null;

          // Dispatch a custom event so the app can react if needed
          window.dispatchEvent(new CustomEvent('sw:registration-failed', {
            detail: { error: err.message }
          }));

          return null;
        }
      }

      /* ─── Online / Offline Monitoring ───────────────────────────────── */
      function setupConnectivityMonitoring() {
        window.addEventListener('online', function () {
          STATE.isOnline = true;
          log('Network: online');

          // Optionally trigger an immediate update check when coming back online
          if (STATE.registration) {
            STATE.registration.update().catch(function () {});
          }

          window.dispatchEvent(new CustomEvent('sw:online'));
        });

        window.addEventListener('offline', function () {
          STATE.isOnline = false;
          log('Network: offline');
          window.dispatchEvent(new CustomEvent('sw:offline'));
        });

        log('Connectivity monitoring enabled. Current status:', STATE.isOnline ? 'online' : 'offline');
      }

      /* ─── Message Handler (SW → Page) ───────────────────────────────── */
      function setupMessageHandler() {
        navigator.serviceWorker.addEventListener('message', function (event) {
          log('Message from SW:', event.data);

          if (event.data && event.data.type) {
            switch (event.data.type) {
              case 'UPDATE_AVAILABLE':
                log('SW notified: update available');
                if (!STATE.updateBannerVisible && CONFIG.updateBannerAutoShow) {
                  showUpdateBanner();
                }
                break;

              case 'CACHE_UPDATED':
                log('SW notified: cache updated —', event.data.payload);
                break;

              case 'OFFLINE_READY':
                log('SW notified: offline content ready');
                break;

              default:
                log('Unhandled SW message type:', event.data.type);
            }
          }

          // Forward all SW messages as custom events
          window.dispatchEvent(new CustomEvent('sw:message', {
            detail: event.data
          }));
        });

        log('SW message handler configured');
      }

      /* ─── Debug: Unregister Helper ──────────────────────────────────── */
      function exposeDebugAPI() {
        if (!CONFIG.debug) return;

        window.__swDebug = {
          state: STATE,
          config: CONFIG,
          register: registerSW,

          unregister: async function () {
            if (STATE.registration) {
              const success = await STATE.registration.unregister();
              log('Unregistration result:', success);

              STATE.registration = null;
              STATE.activeWorker = null;
              STATE.waitingWorker = null;
              STATE.installingWorker = null;

              if (STATE.updateCheckTimer) clearInterval(STATE.updateCheckTimer);
              dismissUpdateBanner();

              return success;
            }
            return false;
          },

          update: function () {
            if (STATE.registration) {
              return STATE.registration.update();
            }
            return Promise.reject(new Error('No registration'));
          },

          showUpdateBanner: showUpdateBanner,
          dismissUpdateBanner: dismissUpdateBanner,
          triggerUpdate: triggerUpdate
        };

        console.log(
          '%c[SW·Reg] %cDebug API exposed at %cwindow.__swDebug',
          'color: #4da6ff;',
          'color: inherit;',
          'font-weight: bold; color: #34c759;'
        );
        console.log('  __swDebug.state           — Current state');
        console.log('  __swDebug.register()      — Re-register SW');
        console.log('  __swDebug.unregister()    — Unregister SW');
        console.log('  __swDebug.update()        — Force update check');
        console.log('  __swDebug.triggerUpdate() — Skip waiting + reload');
      }

      /* ─── Initialization ────────────────────────────────────────────── */
      async function init() {
        log('Starting initialization...');

        if (!detectSupport()) {
          // SW not supported — exit gracefully
          // (the install banner may still work via beforeinstallprompt on some browsers)
          exposeDebugAPI();
          return;
        }

        setupConnectivityMonitoring();
        setupMessageHandler();

        const registration = await registerSW();

        if (registration) {
          log('Service worker registration complete.');
          window.dispatchEvent(new CustomEvent('sw:ready', {
            detail: { registration }
          }));
        }

        exposeDebugAPI();
      }

      /* ─── Handle Controller Change (External) ───────────────────────── */
      // Catches cases where skipWaiting is called from DevTools or another tab,
      // ensuring our state stays in sync.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        log('Controller change detected (may be from another tab)');

        if (navigator.serviceWorker.controller) {
          STATE.activeWorker = navigator.serviceWorker.controller;
          STATE.waitingWorker = null;
          STATE.installingWorker = null;
        }

        window.dispatchEvent(new CustomEvent('sw:controller-change'));
      });

      /* ─── Handle Service Worker Errors ──────────────────────────────── */
      navigator.serviceWorker.addEventListener('messageerror', function (event) {
        error('Message error from SW:', event);
        window.dispatchEvent(new CustomEvent('sw:message-error', {
          detail: event
        }));
      });

      /* ─── Start ─────────────────────────────────────────────────────── */
      // Run immediately if the document is already parsed (script at end of body),
      // otherwise wait for DOM readiness.
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      /* ─── Expose for install-banner integration ─────────────────────── */
      window.__swRegistration = function () { return STATE.registration; };
      window.__swState        = function () { return STATE; };

      log('Service Worker registration module loaded.');
    })();
  </script>

  <!-- ───────────────────────────────────────────────────────────────────────
       Add-to-home-screen install banner
       ─────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      // Already installed / running standalone → do nothing
      if (
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone
      ) {
        return;
      }

      let deferredPrompt;
      let banner;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;

        if (banner) {
          banner.style.pointerEvents = 'auto';
          banner.style.opacity = '1';
        }
      });

      banner = document.createElement('div');
      banner.className = 'installBanner';
      banner.setAttribute('data-overlay', 'install');
      banner.style.pointerEvents = 'none';
      banner.innerHTML = `
        <div class="text">
          <p class="title">Install App</p>
          <p class="desc">Add to Home Screen for fast, full-screen access</p>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24">
            <polyline points="7 17 12 22 17 17" />
            <line x1="12" y1="22" x2="12" y2="2" />
          </svg>
        </div>
      `;

      document.body.prepend(banner);

      banner.addEventListener('click', async () => {
        if (!deferredPrompt) return;

        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;

        if (outcome === 'accepted') banner.remove();
      });

      // Auto-dismiss after a short window
      setTimeout(() => {
        if (banner && banner.parentNode) {
          banner.style.opacity = '0';
          banner.style.pointerEvents = 'none';

          setTimeout(() => {
            if (banner.parentNode) banner.remove();
          }, 250);
        }
      }, 3000);

      window.addEventListener('appinstalled', () => {
        if (banner && banner.parentNode) banner.remove();
      });
    })();
  </script>
