      color: inherit;

      cursor: pointer;
      transition: background .15s, transform .12s;

      background: rgba(var(--textPrimary) / .14);
      transform: translateY(-1px);
    }

    .album-art-wrapper:not(.video-mode) {
      cursor: pointer;
    }

    @media (hover: hover) {
      .album-art-wrapper:not(.video-mode):hover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, .22) 100%);
        pointer-events: none;
        border-radius: inherit;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .album-art-wrapper:not(.video-mode)::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        opacity: 0;
        transition: opacity .25s;
        background: radial-gradient(circle at center, rgba(0, 0, 0, .4), transparent 65%);
      }

      .album-art-wrapper:active::before {
        opacity: 1;
      }
    }
  </style>

  <script>
    (function initTheme() {
      var DARK_THEMES = ['dark', 'midnight', 'graphite', 'forest'];
      var LIGHT_THEMES = ['ivory', 'slate', 'linen', 'mint', 'chalk', 'aurora'];
      var ALL_THEMES = DARK_THEMES.concat(LIGHT_THEMES);

      var THEME_COLORS = {
//      dark: '#353b45',
        dark: '#22272F',
        midnight: '#29303c',
        graphite: '#3a3a3d',
        forest: '#313e37',
        ivory: '#e8e0d4',
        slate: '#dae4f0',
        linen: '#ecdece',
        mint: '#d8eae4',
        chalk: '#eeecea',
        aurora: '#eae2f6'
      };

      var savedTheme = localStorage.getItem('theme') || 'light';
      if (ALL_THEMES.indexOf(savedTheme) === -1) {
        savedTheme = 'dark';
      }

      document.documentElement.setAttribute('data-theme', savedTheme);

      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', THEME_COLORS[savedTheme] || THEME_COLORS.dark);
      }

      var isDark = DARK_THEMES.indexOf(savedTheme) !== -1;
      document.querySelectorAll('.themeToggle').forEach(function (btn) {
        btn.classList.toggle('dark', isDark);
      });
    })();
  </script>

    <script>
      (async function bootstrap() {
        try {
          console.log('[bootstrap] fetching library.index.json');
          const r = await fetch('https://clockblocked.github.io/music.me/library/library.index.json');
          if (!r.ok) throw new Error(`HTTP ${r.status} for library.index.json`);
          const data = await r.json();
          window.MusicStore = window.MusicStore || {};
          window.MusicStore.index = data.artists || [];
          console.log('[bootstrap] index loaded:', window.MusicStore.index.length, 'artists');

          const s = document.createElement('script');
          s.src = 'https://clockblocked.github.io/music.me/source/boot.js';
          s.onerror = () => console.error('[bootstrap] boot.js failed to load');
          s.onload = () => console.log('[bootstrap] boot.js loaded');
          document.body.appendChild(s);
        } catch (e) {
          console.error('[bootstrap] failed:', e);
          const d = document.createElement('div');
          d.style.cssText = 'color:#ff6b6b;font-family:monospace;padding:2rem;white-space:pre-wrap;';
          d.textContent = 'Bootstrap failed:\n' + e.message;
          document.body.appendChild(d);
        }
      })();
    </script>
